[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "btc-backtester"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "mplfinance>=0.12.9b0",
    "requests>=2.31",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["data", "engine", "strategies", "metrics", "reporting"]
